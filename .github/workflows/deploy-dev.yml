name: Deploy to Dev Server

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:   # Actions 탭에서 수동 실행

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build & Test
        run: ./mvnw clean verify -DskipTests   # TODO: CI에 DB 서비스 붙으면 테스트 활성화

  # develop에 푸시되면 자동 배포
  deploy-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Build & Push Docker Image (dev)
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/swucjute/api:dev .
          docker push ghcr.io/swucjute/api:dev

      # ✅ deploy 사용자로 실행 (root 대신)
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}  # deploy 사용자
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script_stop: true   # 중간 명령 실패 시 즉시 중단 → Action 실패로 표시
          script: |
            cd /home/deploy/infra  # ← deploy 사용자의 infra 경로
            docker compose -f docker-compose.dev.yml pull spring-app
            docker compose -f docker-compose.dev.yml up -d --no-deps spring-app
            docker image prune -f
            echo "✅ Deploy completed at $(date)"
