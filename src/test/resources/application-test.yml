spring:
  datasource:
    url: jdbc:h2:mem:swucjute_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/swucjute_test

logging:
  level:
    com.swucjute.api: INFO
    org.hibernate.SQL: WARN
